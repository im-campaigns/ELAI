name: 매주 초급 AI 강의 자동 생성

on:
  schedule:
    # 매주 월요일 오전 9시 (KST = UTC+9, 즉 UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  generate-lesson:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: 새 강의 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-weekly-lesson.mjs

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "ELAI Bot"
          git config user.email "bot@elai.ai"
          git add data/lessons.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 강의가 이미 존재합니다"
          else
            WEEK=$(node -e "const d=require('./data/lessons.json');const m=Math.max(...d.lessons.map(l=>l.weekNumber));console.log(m)")
            git commit -m "feat: Week ${WEEK} 초급 AI 강의 자동 생성 [skip ci]"
            git push
          fi
