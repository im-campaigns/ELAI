name: 매주 트렌드 글 자동 생성

on:
  schedule:
    # 매주 월요일 오전 9시 (KST = UTC+9, 즉 UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행도 가능

concurrency:
  group: weekly-trend
  cancel-in-progress: false

jobs:
  generate-trend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: 새 트렌드 글 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-weekly-trend.mjs

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "ELAI Bot"
          git config user.email "bot@elai.ai"
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 글이 이미 존재합니다"
          else
            TITLE=$(node -e "const d=require('./data/posts.json');console.log(d.posts[d.posts.length-1].title)")
            git commit -m "feat: 트렌드 글 자동 생성 - ${TITLE} [skip ci]"
            git push
          fi
